<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lapor Sampah - Ngambon, Tambakrejo, Bojonegoro</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #2c7a3e;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .logo h1 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .subtitle {
            font-size: 0.7rem;
            opacity: 0.9;
        }
        .stats {
            background: #f0f0f0;
            padding: 5px 12px;
            border-radius: 30px;
            color: #2c7a3e;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .btn-lapor {
            background: #f4a261;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-lapor:hover {
            background: #e76f51;
        }
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
        .info-panel {
            position: absolute;
            bottom: 20px;
            right: 10px;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-size: 12px;
            z-index: 1000;
            font-weight: bold;
            pointer-events: none;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 20px black;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            color: #2c7a3e;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-family: inherit;
        }
        .modal-content button {
            background: #2c7a3e;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .close-modal {
            background: #aaa !important;
            margin-top: 8px;
        }
        @media (max-width: 600px) {
            .logo h1 { font-size: 1rem; }
            .btn-lapor { padding: 5px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1><i class="fas fa-trash-alt"></i> LaporSampah <span class="subtitle">Ngambon - Tambakrejo Bojonegoro</span></h1>
        </div>
        <div class="stats">
            <i class="fas fa-flag-checkered"></i> Total laporan: <span id="totalReports">0</span>
        </div>
        <button class="btn-lapor" id="openModalBtn"><i class="fas fa-camera"></i> Foto & Lapor</button>
    </header>
    <div id="map"></div>
    <div class="info-panel">
        <i class="fas fa-map-marker-alt"></i> Lokasi: Ngambon, Tambakrejo, Bojonegoro
    </div>

    <!-- Modal untuk foto + lokasi -->
    <div id="reportModal" class="modal">
        <div class="modal-content">
            <h3><i class="fas fa-camera-retro"></i> Laporan Tumpukan Sampah</h3>
            <p style="font-size: 14px; margin-bottom: 8px;">📸 Ambil foto atau unggah gambar sampah</p>
            <input type="file" id="photoInput" accept="image/*" capture="environment">
            <div id="imagePreview" style="margin: 8px 0; text-align: center;"></div>
            <textarea id="descInput" rows="2" placeholder="Deskripsi (contoh: sampah rumah tangga, RT 02 RW 03)"></textarea>
            <button id="submitReportBtn"><i class="fas fa-map-marker-alt"></i> Kirim Laporan (Lokasi Saat Ini)</button>
            <button id="closeModalBtn" class="close-modal">Batal</button>
        </div>
    </div>

    <script>
        // ========== SKALA: NGAMBON - TAMBAKREJO, BOJONEGORO ==========
        // Koordinat Desa Ngambon, Kecamatan Tambakrejo, Kabupaten Bojonegoro (perkiraan)
        const CENTER_LAT = -7.2833;
        const CENTER_LNG = 111.7167;
        const ZOOM_LEVEL = 15;  // skala lebih detail (RT/RW)

        // Inisialisasi peta dengan pusat Ngambon
        var map = L.map('map').setView([CENTER_LAT, CENTER_LNG], ZOOM_LEVEL);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> & CartoDB | Ngambon, Tambakrejo, Bojonegoro'
        }).addTo(map);

        // Custom icon untuk marker sampah
        var trashIcon = L.divIcon({
            html: '<i class="fas fa-trash-alt" style="color:#d9534f; font-size:28px; text-shadow: 1px 1px white;"></i>',
            iconSize: [30, 30],
            className: 'custom-trash-marker'
        });

        // Data laporan disimpan di localStorage
        let reports = [];

        // Fungsi load data dari localStorage (dengan contoh awal di area Ngambon)
        function loadReportsFromStorage() {
            const stored = localStorage.getItem('wargaSampahReports_Ngambon');
            if (stored) {
                reports = JSON.parse(stored);
            } else {
                // Data contoh untuk wilayah Ngambon, Tambakrejo
                reports = [
                    {
                        id: Date.now() + 1,
                        lat: -7.2820,
                        lng: 111.7155,
                        imageData: null,
                        description: "Tumpukan sampah di pinggir jalan desa dekat balai RT 02",
                        timestamp: new Date().toLocaleString(),
                        status: "Menunggu",
                        alamat: "Dusun Ngambon"
                    },
                    {
                        id: Date.now() + 2,
                        lat: -7.2845,
                        lng: 111.7180,
                        imageData: null,
                        description: "Sampah menumpuk di sekitar sungai kecil, rawan banjir",
                        timestamp: new Date().toLocaleString(),
                        status: "Menunggu",
                        alamat: "Dusun Tambakrejo"
                    },
                    {
                        id: Date.now() + 3,
                        lat: -7.2810,
                        lng: 111.7140,
                        imageData: null,
                        description: "Tempat pembuangan liar dekat persawahan",
                        timestamp: new Date().toLocaleString(),
                        status: "Menunggu",
                        alamat: "Perbatasan Ngambon"
                    }
                ];
                saveReportsToStorage();
            }
            updateTotalReports();
            renderMarkers();
        }

        function saveReportsToStorage() {
            localStorage.setItem('wargaSampahReports_Ngambon', JSON.stringify(reports));
        }

        function updateTotalReports() {
            document.getElementById('totalReports').innerText = reports.length;
        }

        let markerLayerGroup = L.layerGroup().addTo(map);
        function renderMarkers() {
            markerLayerGroup.clearLayers();
            reports.forEach(report => {
                let marker = L.marker([report.lat, report.lng], { icon: trashIcon }).addTo(markerLayerGroup);
                let imageHtml = '';
                if (report.imageData) {
                    imageHtml = `<img src="${report.imageData}" style="max-width:150px; border-radius:8px; margin-top:5px;"><br>`;
                }
                let statusBadge = `<span style="background:${report.status === 'Sudah Ditangani' ? '#2c7a3e' : '#f4a261'}; padding:2px 8px; border-radius:12px; font-size:12px; color:white;">${report.status || 'Menunggu'}</span>`;
                let popupContent = `
                    <b>🗑️ Laporan Sampah - Ngambon</b><br>
                    📅 ${report.timestamp}<br>
                    📝 ${report.description || 'Tidak ada deskripsi'}<br>
                    ${imageHtml}
                    ${statusBadge}<br>
                    <button class="mark-done-btn" data-id="${report.id}" style="margin-top:6px; background:#2c7a3e; color:white; border:none; border-radius:15px; padding:3px 10px; cursor:pointer;">✔️ Tandai Ditangani (Petugas DLH)</button>
                `;
                marker.bindPopup(popupContent);
            });
            document.querySelectorAll('.mark-done-btn').forEach(btn => {
                btn.removeEventListener('click', handleMarkDone);
                btn.addEventListener('click', handleMarkDone);
            });
        }

        function handleMarkDone(e) {
            e.stopPropagation();
            const reportId = parseInt(e.target.getAttribute('data-id'));
            const index = reports.findIndex(r => r.id === reportId);
            if (index !== -1) {
                reports[index].status = "Sudah Ditangani";
                saveReportsToStorage();
                renderMarkers();
                alert("✅ Status diperbarui: petugas telah menangani sampah di Ngambon.");
            }
        }

        function getCurrentPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject("Geolocation tidak didukung browser Anda.");
                } else {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 10000
                    });
                }
            });
        }

        // Modal handling
        const modal = document.getElementById('reportModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const submitBtn = document.getElementById('submitReportBtn');
        const photoInput = document.getElementById('photoInput');
        const descInput = document.getElementById('descInput');
        const imagePreviewDiv = document.getElementById('imagePreview');

        openBtn.onclick = () => {
            modal.style.display = 'flex';
            photoInput.value = '';
            descInput.value = '';
            imagePreviewDiv.innerHTML = '';
        };
        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    imagePreviewDiv.innerHTML = `<img src="${ev.target.result}" style="max-width:100%; max-height:120px; border-radius:10px;">`;
                };
                reader.readAsDataURL(file);
            } else {
                imagePreviewDiv.innerHTML = '';
            }
        });

        submitBtn.onclick = async () => {
            try {
                const position = await getCurrentPosition();
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                // Validasi apakah lokasi masih dalam radius Ngambon Tambakrejo (opsional: batasan kasar)
                const latDiff = Math.abs(lat - CENTER_LAT);
                const lngDiff = Math.abs(lng - CENTER_LNG);
                if (latDiff > 0.05 || lngDiff > 0.05) {
                    if(!confirm("Lokasi Anda agak jauh dari area Ngambon. Tetap laporkan? Data akan tetap tersimpan untuk petugas.")) {
                        return;
                    }
                }

                let imageData = null;
                if (photoInput.files && photoInput.files[0]) {
                    const file = photoInput.files[0];
                    imageData = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(file);
                    });
                }

                const newReport = {
                    id: Date.now(),
                    lat: lat,
                    lng: lng,
                    imageData: imageData,
                    description: descInput.value.trim() || "Tumpukan sampah di Ngambon/Tambakrejo",
                    timestamp: new Date().toLocaleString(),
                    status: "Menunggu",
                    alamat: "Lokasi real-time"
                };
                reports.unshift(newReport);
                saveReportsToStorage();
                updateTotalReports();
                renderMarkers();

                L.popup()
                    .setLatLng([lat, lng])
                    .setContent("✅ Laporan terkirim! Dinas Lingkungan Hidup Bojonegoro akan segera menindaklanjuti.")
                    .openOn(map);

                modal.style.display = 'none';
                photoInput.value = '';
                descInput.value = '';
                imagePreviewDiv.innerHTML = '';
                map.setView([lat, lng], 16);
            } catch (error) {
                alert("Gagal mendapatkan lokasi: " + error.message + "\nPastikan GPS aktif dan izin lokasi diberikan.");
            }
        };

        // Sinkronisasi antar tab
        window.addEventListener('storage', (e) => {
            if (e.key === 'wargaSampahReports_Ngambon') {
                loadReportsFromStorage();
                renderMarkers();
            }
        });

        // Init map & data spesifik Bojonegoro
        loadReportsFromStorage();

        // Tambahkan marker batas desa (opsional) untuk informasi warga
        L.marker([-7.2833, 111.7167]).addTo(map)
            .bindPopup("<b>📌 Pusat Desa Ngambon</b><br>Kec. Tambakrejo, Bojonegoro")
            .openPopup();
    </script>
</body>
</html>
